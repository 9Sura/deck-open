# Supabase local-stack config (Phase 4a). `supabase start` runs this in Docker.
# The hosted project mirrors the auth settings below — most critically
# email confirmations MUST stay OFF (synthetic-email username auth, D2): a
# `<username>@users.deck.app` address can never receive a confirmation link, so
# requiring confirmation would lock every new account out.
project_id = "deck"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local inbucket inbox — only used if a future email step is added; synthetic-email
# username auth never sends mail.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Overridden per-environment; localhost for the local stack.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# CRITICAL: synthetic emails can't receive a confirmation link (D2). Keep OFF here
# AND in the hosted dashboard (Authentication -> Providers -> Email -> "Confirm email").
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

# No external OAuth providers in 4a (username + password only). A future email/
# OAuth step (D2) adds providers + an app/auth/callback route here.
